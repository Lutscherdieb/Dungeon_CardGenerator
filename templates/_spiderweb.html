{# templates/_spiderweb.html #}
{% if Spiderweb and Spiderweb.lines is defined %}
<svg class="tier-filaments" viewBox="0 0 1125 1125" width="1125" height="1125" aria-hidden="true">

  {# Rays (as polylines) #}
  {% for pts in Spiderweb.lines %}
    <polyline class="ray t{{ Tier|default(1) }}"
      points="{% for p in pts %}{{ p[0] }},{{ p[1] }}{% if not loop.last %} {% endif %}{% endfor %}">
    </polyline>
  {% endfor %}



</svg>
{% endif %}
